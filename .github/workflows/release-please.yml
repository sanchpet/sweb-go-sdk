name: release-please

# release-please maintains the version + CHANGELOG.md from Conventional Commits.
# On push to main it opens/updates a "release PR"; merging that PR tags the
# release and (for a library) creates the GitHub Release. No manual tagging.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
      # Manifest mode: reads release-please-config.json + .release-please-manifest.json.
      # App token (not GITHUB_TOKEN) so the release PR it opens triggers CI / pr-title checks.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
